<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262F"/>
      <stop offset="1" stop-color="#0A0B0F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Hai mặt của chữ Λ -->
    <linearGradient id="lit" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A3ADC8"/>
    </linearGradient>
    <linearGradient id="shade" x1="1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#7C86A6"/>
      <stop offset="1" stop-color="#3A4058"/>
    </linearGradient>

    <!-- Lõi agent -->
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A4A"/>
      <stop offset="1" stop-color="#FF2D4F"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Thân icon -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Chữ Λ: nửa trái sáng, nửa phải tối -->
  <polygon points="512,236 270,780 400,780 512,500" fill="url(#lit)"/>
  <polygon points="512,236 512,500 624,780 754,780" fill="url(#shade)"/>

  <!-- Lõi agent -->
  <polygon points="512,592 556,662 512,732 468,662" fill="url(#core)" filter="url(#glow)"/>

  <!-- Viền kính -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
